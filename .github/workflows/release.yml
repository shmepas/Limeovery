name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          & msbuild Limeovery/Limeovery.csproj /m /p:Configuration=Release /p:Platform=AnyCPU /p:SignManifests=false /p:GenerateManifests=false /nologo /v:minimal *> msbuild.log
          $buildExitCode = $LASTEXITCODE
          Get-Content msbuild.log | ForEach-Object { Write-Host $_ }
          if ($buildExitCode -ne 0) {
            '### Build Release failed' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content msbuild.log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $buildExitCode
          }
          foreach ($requiredPath in @('Limeovery/bin/Release/Limeovery.exe', 'Limeovery/bin/Release/Tools/SU/SU.exe', 'Limeovery/bin/Release/Tools/PH/PH.exe')) {
            if (-not (Test-Path $requiredPath)) { throw "Required release file missing: $requiredPath" }
          }

      - name: Package application
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $source = (Resolve-Path 'Limeovery/bin/Release').Path
          $destination = 'Limeovery-${{ github.ref_name }}-win-x64.zip'
          $archive = [System.IO.Compression.ZipFile]::Open($destination, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            Get-ChildItem -LiteralPath $source -Recurse -File | Where-Object { $_.Extension -ne '.pdb' } | ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($source, $_.FullName).Replace([System.IO.Path]::DirectorySeparatorChar, '/')
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($archive, $_.FullName, $relativePath, [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "Limeovery-${{ github.ref_name }}-win-x64.zip" --generate-notes --title "Limeovery ${{ github.ref_name }}"
